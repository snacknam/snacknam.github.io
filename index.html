<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SnackNam</title>
<style>
  :root { --bg:#161C38; --card:#232C52; --edge:#151B37; --ink:#FFFFFF; --muted:#8B94BE; --accent:#FFC83D; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.6 ui-rounded, "SF Pro Rounded", system-ui, -apple-system, sans-serif; }
  main { max-width:680px; margin:0 auto; padding:56px 16px 64px; }
  h1 { font-size:40px; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 28px; }
  a.card { display:flex; gap:16px; align-items:center; background:var(--card); box-shadow:0 5px 0 var(--edge); border-radius:20px; padding:18px; color:inherit; text-decoration:none; }
  a.card img { width:64px; height:64px; border-radius:15px; }
  a.card b { font-size:20px; display:block; }
  .muted { color:var(--muted); font-size:14px; }
</style>
</head>
<body>
<main>
<h1>SnackNam</h1>
<p class="sub">Small, sweet games.</p>
<a class="card" href="/swooshi/"><img src="/swooshi/icon.png" alt=""><span><b>Swooshi</b><span class="muted">Swipe and every block slides. Fill a line to pop it.</span></span></a>
<p class="muted" style="margin-top:32px">Support: <a href="/swooshi/#support" style="color:inherit">Swooshi support</a> · © 2026 SnackNam</p>
</main>
</body>
</html>
